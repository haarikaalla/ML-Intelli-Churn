[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "intelli-churn"
version = "1.0.0"
description = "Reproducible telecom churn training, inference and drift monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Haarika Alla"}]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
intelli-churn-train = "intelli_churn.training:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intelli_churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
