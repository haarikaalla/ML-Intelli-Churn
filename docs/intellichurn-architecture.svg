<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">IntelliChurn human-centered end-to-end architecture</title>
  <desc id="desc">Customer signals flow through a governed machine learning factory and model registry into real-time and batch decisions for retention specialists. Outcomes and monitoring signals feed the next training cycle.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172554" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#6d28d9"/>
    </marker>
    <style>
      .title { font: 700 35px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e0e7ff; }
      .lane { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.6px; }
      .section { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .sectionSub { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .cardTitle { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1e293b; }
      .cardText { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .chip { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; }
      .number { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .small { font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .footerTitle { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .footerText { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="24" fill="url(#background)"/>
  <rect x="24" y="24" width="1552" height="118" rx="22" fill="url(#hero)"/>
  <circle cx="78" cy="83" r="32" fill="#ffffff" opacity="0.16"/>
  <path d="M61 88 C67 70, 77 67, 82 83 C88 62, 101 65, 101 87" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="132" y="73" class="title">IntelliChurn · Human-centered ML decision system</text>
  <text x="132" y="105" class="subtitle">From customer signals to governed predictions, helpful retention actions and measurable learning</text>
  <rect x="1274" y="55" width="254" height="56" rx="16" fill="#ffffff" opacity="0.13"/>
  <text x="1401" y="78" text-anchor="middle" class="chip" fill="#ffffff">DESIGN PRINCIPLE</text>
  <text x="1401" y="98" text-anchor="middle" class="subtitle">Model advises · humans decide</text>

  <rect x="54" y="165" width="838" height="32" rx="16" fill="#e0e7ff"/>
  <text x="473" y="186" text-anchor="middle" class="lane" fill="#4338ca">OFFLINE LEARNING &amp; GOVERNANCE</text>
  <rect x="940" y="165" width="606" height="32" rx="16" fill="#ccfbf1"/>
  <text x="1243" y="186" text-anchor="middle" class="lane" fill="#0f766e">ONLINE DECISIONS &amp; HUMAN ACTION</text>

  <!-- Column 1: customer reality -->
  <g filter="url(#shadow)">
    <rect x="54" y="220" width="292" height="632" rx="22" fill="#ffffff" stroke="#c7d2fe"/>
  </g>
  <text x="84" y="260" class="section">Customer reality</text>
  <text x="84" y="284" class="sectionSub">Signals created through real experiences</text>

  <circle cx="200" cy="354" r="45" fill="#eef2ff"/>
  <circle cx="200" cy="339" r="14" fill="#6366f1"/>
  <path d="M170 384 C174 355, 226 355, 230 384" fill="#818cf8"/>
  <circle cx="238" cy="330" r="15" fill="#ccfbf1"/>
  <path d="M232 330 l5 5 9 -11" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="422" text-anchor="middle" class="cardTitle">Telecom customer</text>
  <text x="200" y="443" text-anchor="middle" class="cardText">Every score represents a person,</text>
  <text x="200" y="460" text-anchor="middle" class="cardText">not merely a row in a dataset.</text>

  <rect x="82" y="495" width="236" height="58" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="108" cy="524" r="13" fill="#dbeafe"/>
  <path d="M102 524 h12 M108 518 v12" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="519" class="cardTitle">Relationship profile</text>
  <text x="130" y="538" class="cardText">Tenure · contract · dependents</text>

  <rect x="82" y="565" width="236" height="58" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="108" cy="594" r="13" fill="#fef3c7"/>
  <path d="M103 588 h10 v12 h-10 z M106 591 h4" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="589" class="cardTitle">Billing behavior</text>
  <text x="130" y="608" class="cardText">Charges · payment · paperless</text>

  <rect x="82" y="635" width="236" height="58" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="108" cy="664" r="13" fill="#dcfce7"/>
  <path d="M101 666 q7 -12 14 0 M104 669 h8" fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="130" y="659" class="cardTitle">Service experience</text>
  <text x="130" y="678" class="cardText">Internet · security · support</text>

  <rect x="82" y="714" width="236" height="102" rx="15" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="102" y="743" class="chip" fill="#c2410c">PURPOSE BOUNDARY</text>
  <text x="102" y="767" class="cardText">Use consented operational data.</text>
  <text x="102" y="786" class="cardText">Support customers; never punish</text>
  <text x="102" y="803" class="cardText">or automate irreversible decisions.</text>

  <!-- Connector 1 -->
  <path d="M347 527 H382" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <circle cx="365" cy="503" r="14" fill="#4338ca"/>
  <text x="365" y="508" text-anchor="middle" class="number">1</text>
  <text x="365" y="553" text-anchor="middle" class="small">consented</text>
  <text x="365" y="568" text-anchor="middle" class="small">signals</text>

  <!-- Column 2: ML factory -->
  <g filter="url(#shadow)">
    <rect x="394" y="220" width="498" height="632" rx="22" fill="#ffffff" stroke="#ddd6fe"/>
  </g>
  <text x="426" y="260" class="section">ML intelligence factory</text>
  <text x="426" y="284" class="sectionSub">Reproducible learning with explicit quality gates</text>

  <rect x="426" y="316" width="200" height="96" rx="15" fill="#f5f3ff" stroke="#c4b5fd"/>
  <circle cx="451" cy="341" r="14" fill="#7c3aed"/>
  <text x="451" y="346" text-anchor="middle" class="number">2</text>
  <text x="475" y="346" class="cardTitle">Data quality gate</text>
  <text x="446" y="373" class="cardText">Schema · missingness · labels</text>
  <text x="446" y="393" class="cardText">duplicates · range checks</text>

  <rect x="656" y="316" width="202" height="96" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="681" cy="341" r="14" fill="#2563eb"/>
  <text x="681" y="346" text-anchor="middle" class="number">3</text>
  <text x="705" y="346" class="cardTitle">Domain features</text>
  <text x="676" y="373" class="cardText">Spend ratios · tenure band</text>
  <text x="676" y="393" class="cardText">service count · risk indicators</text>
  <path d="M626 364 H650" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="426" y="446" width="432" height="184" rx="17" fill="#fafafa" stroke="#d8b4fe"/>
  <text x="449" y="478" class="cardTitle">Model tournament · 5-fold stratified CV</text>
  <text x="449" y="499" class="cardText">Choose evidence over preference: the highest mean PR-AUC wins.</text>
  <rect x="449" y="522" width="118" height="66" rx="12" fill="#ede9fe"/>
  <text x="508" y="550" text-anchor="middle" class="chip" fill="#5b21b6">LOGISTIC</text>
  <text x="508" y="571" text-anchor="middle" class="small">interpretable</text>
  <rect x="581" y="522" width="118" height="66" rx="12" fill="#e0f2fe"/>
  <text x="640" y="550" text-anchor="middle" class="chip" fill="#0369a1">FOREST</text>
  <text x="640" y="571" text-anchor="middle" class="small">non-linear</text>
  <rect x="713" y="522" width="122" height="66" rx="12" fill="#dcfce7"/>
  <text x="774" y="550" text-anchor="middle" class="chip" fill="#166534">BOOSTING</text>
  <text x="774" y="571" text-anchor="middle" class="small">interactions</text>
  <path d="M642 412 V438" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="426" y="660" width="202" height="118" rx="15" fill="#ecfeff" stroke="#a5f3fc"/>
  <circle cx="451" cy="687" r="14" fill="#0891b2"/>
  <text x="451" y="692" text-anchor="middle" class="number">4</text>
  <text x="475" y="692" class="cardTitle">Calibrate</text>
  <text x="447" y="721" class="cardText">Turn rankings into useful</text>
  <text x="447" y="740" class="cardText">churn probabilities.</text>
  <rect x="656" y="660" width="202" height="118" rx="15" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="681" cy="687" r="14" fill="#ea580c"/>
  <text x="681" y="692" text-anchor="middle" class="number">5</text>
  <text x="705" y="692" class="cardTitle">Set policy</text>
  <text x="677" y="721" class="cardText">Choose threshold from recall</text>
  <text x="677" y="740" class="cardText">and intervention economics.</text>
  <path d="M628 719 H650" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <circle cx="453" cy="816" r="18" fill="#ede9fe"/>
  <circle cx="453" cy="811" r="6" fill="#7c3aed"/>
  <path d="M442 827 C444 817, 462 817, 464 827" fill="#8b5cf6"/>
  <text x="480" y="814" class="cardTitle">ML engineer + data scientist</text>
  <text x="480" y="834" class="cardText">review quality, metrics, assumptions and promotion evidence</text>

  <!-- Connector 2 -->
  <path d="M893 530 H928" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <circle cx="910" cy="506" r="14" fill="#6d28d9"/>
  <text x="910" y="511" text-anchor="middle" class="number">6</text>
  <text x="910" y="556" text-anchor="middle" class="small">approved</text>
  <text x="910" y="571" text-anchor="middle" class="small">bundle</text>

  <!-- Column 3: governance and delivery -->
  <g filter="url(#shadow)">
    <rect x="940" y="220" width="288" height="632" rx="22" fill="#ffffff" stroke="#bae6fd"/>
  </g>
  <text x="970" y="260" class="section">Trust &amp; delivery</text>
  <text x="970" y="284" class="sectionSub">One governed model, multiple consumers</text>

  <rect x="970" y="316" width="228" height="132" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <path d="M994 347 h34 v29 c0 18 -17 29 -17 29 s-17 -11 -17 -29 z" fill="#6366f1"/>
  <path d="M1003 374 l7 7 12 -17" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="1042" y="351" class="cardTitle">Versioned registry</text>
  <text x="1042" y="373" class="cardText">model + threshold</text>
  <text x="1042" y="391" class="cardText">metrics + fingerprint</text>
  <text x="1042" y="409" class="cardText">reference profile</text>
  <text x="1084" y="434" text-anchor="middle" class="chip" fill="#4338ca">AUDITABLE · PINNABLE · ROLLBACK</text>

  <path d="M1084 448 V480" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="970" y="490" width="228" height="208" rx="16" fill="#ecfeff" stroke="#99f6e4"/>
  <circle cx="1000" cy="521" r="17" fill="#0f766e"/>
  <path d="M990 521 h20 M1000 511 v20" stroke="#ffffff" stroke-width="2.5"/>
  <text x="1028" y="526" class="cardTitle">FastAPI decision layer</text>
  <rect x="990" y="550" width="188" height="31" rx="8" fill="#ffffff"/>
  <text x="1002" y="570" class="chip" fill="#0f766e">POST /v1/predict</text>
  <rect x="990" y="589" width="188" height="31" rx="8" fill="#ffffff"/>
  <text x="1002" y="609" class="chip" fill="#0f766e">POST /v1/predict/batch</text>
  <rect x="990" y="628" width="188" height="31" rx="8" fill="#ffffff"/>
  <text x="1002" y="648" class="chip" fill="#0f766e">GET /v1/model</text>
  <text x="1084" y="683" text-anchor="middle" class="small">strict schema · request ID · health</text>

  <rect x="970" y="730" width="228" height="86" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="990" y="757" class="cardTitle">Operational visibility</text>
  <text x="990" y="780" class="cardText">Prometheus latency + traffic</text>
  <text x="990" y="799" class="cardText">prediction mix + readiness</text>

  <!-- Connector 3 -->
  <path d="M1229 527 H1262" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <circle cx="1246" cy="503" r="14" fill="#0f766e"/>
  <text x="1246" y="508" text-anchor="middle" class="number">7</text>
  <text x="1246" y="555" text-anchor="middle" class="small">risk + next</text>
  <text x="1246" y="570" text-anchor="middle" class="small">best action</text>

  <!-- Column 4: human action -->
  <g filter="url(#shadow)">
    <rect x="1274" y="220" width="272" height="632" rx="22" fill="#ffffff" stroke="#99f6e4"/>
  </g>
  <text x="1304" y="260" class="section">Human action</text>
  <text x="1304" y="284" class="sectionSub">A decision aid for retention teams</text>

  <circle cx="1410" cy="352" r="43" fill="#ccfbf1"/>
  <circle cx="1410" cy="338" r="13" fill="#0f766e"/>
  <path d="M1382 381 C1386 354, 1434 354, 1438 381" fill="#14b8a6"/>
  <path d="M1441 337 q18 10 0 22" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <text x="1410" y="417" text-anchor="middle" class="cardTitle">Retention specialist</text>
  <text x="1410" y="438" text-anchor="middle" class="cardText">reviews context before acting</text>

  <rect x="1304" y="469" width="212" height="135" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="1324" y="498" class="chip" fill="#0f766e">STREAMLIT WORK QUEUE</text>
  <circle cx="1327" cy="526" r="6" fill="#dc2626"/>
  <rect x="1342" y="519" width="146" height="13" rx="6" fill="#fecaca"/>
  <circle cx="1327" cy="551" r="6" fill="#f59e0b"/>
  <rect x="1342" y="544" width="112" height="13" rx="6" fill="#fde68a"/>
  <circle cx="1327" cy="576" r="6" fill="#16a34a"/>
  <rect x="1342" y="569" width="76" height="13" rx="6" fill="#bbf7d0"/>

  <rect x="1304" y="630" width="212" height="146" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1324" y="658" class="cardTitle">Personalized support</text>
  <text x="1324" y="684" class="cardText">• priority service recovery</text>
  <text x="1324" y="706" class="cardText">• relevant plan or offer</text>
  <text x="1324" y="728" class="cardText">• proactive check-in</text>
  <text x="1324" y="750" class="cardText">• standard journey</text>

  <rect x="1304" y="796" width="212" height="36" rx="10" fill="#0f766e"/>
  <text x="1410" y="819" text-anchor="middle" class="chip" fill="#ffffff">HUMAN APPROVAL &amp; OUTCOME</text>

  <!-- Learning loop -->
  <rect x="54" y="888" width="1492" height="116" rx="22" fill="#172554"/>
  <circle cx="88" cy="922" r="15" fill="#6d28d9"/>
  <text x="88" y="927" text-anchor="middle" class="number">8</text>
  <text x="114" y="928" class="footerTitle">Measure what happened, then learn safely</text>
  <text x="114" y="952" class="footerText">Campaign response · retained customers · false alarms · delayed churn labels · subgroup outcomes</text>

  <path d="M661 947 H734" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="754" y="911" width="304" height="70" rx="15" fill="#243b67" stroke="#475569"/>
  <text x="906" y="938" text-anchor="middle" class="footerTitle">Monitor &amp; decide</text>
  <text x="906" y="961" text-anchor="middle" class="footerText">PSI + JS drift · calibration · service SLOs</text>
  <path d="M1070 947 H1138" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1156" y="911" width="338" height="70" rx="15" fill="#243b67" stroke="#475569"/>
  <text x="1325" y="938" text-anchor="middle" class="footerTitle">Governed retraining trigger</text>
  <text x="1325" y="961" text-anchor="middle" class="footerText">new evidence → validation gates → human approval</text>

  <path d="M1495 911 C1543 864, 1560 800, 1545 720" stroke="#6d28d9" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M1155 980 C885 1028, 512 1021, 286 856" stroke="#6d28d9" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="547" y="1000" class="chip" fill="#c4b5fd">FEEDBACK LOOP — NO SILENT AUTO-RETRAINING</text>
</svg>
